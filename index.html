<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chargebacks Dashboard</title>
<style>
  :root{
    --ink:#150a22; --ink-2:#1c0f2e; --panel:#20112f; --panel-2:#2a1640;
    --line:#3d2154; --text:#f1e9fb; --muted:#a68fc4;
    --brand:#c026d3; --brand-2:#7c3aed;
    --mono:'IBM Plex Mono', monospace; --sans:'Manrope', sans-serif; --display:'Cormorant Garamond', serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--text); font-family:var(--sans);
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(192,38,211,.35), transparent 60%),
      radial-gradient(ellipse 700px 600px at 100% 0%, rgba(124,58,237,.30), transparent 55%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    background-attachment:fixed;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{ max-width:900px; width:100%; text-align:center; }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  h1{ font-family:var(--display); font-style:italic; font-size:44px; font-weight:700; margin:10px 0 40px; }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .card{
    background:linear-gradient(160deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:16px; padding:36px 28px;
    text-decoration:none; color:var(--text); transition:transform .15s, box-shadow .15s;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 12px 40px rgba(192,38,211,.25); border-color:var(--brand); }
  .card h2{ font-family:var(--display); font-style:italic; font-size:28px; margin:0 0 8px; }
  .card p{ color:var(--muted); font-size:13px; margin:0; font-family:var(--mono); }
  @media (max-width:640px){ .cards{ grid-template-columns:1fr; } h1{ font-size:32px; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Chargebacks · Disputes</div>
    <h1>Choose a product</h1>
    <div class="cards">
      <a class="card" href="dashboard.html?product=dramashorts&type=card">
        <h2>DramaShorts</h2>
        <p>Card &amp; PayPal chargebacks</p>
      </a>
      <a class="card" href="dashboard.html?product=alphanovel&type=card">
        <h2>AlphaNovel</h2>
        <p>Card &amp; PayPal chargebacks</p>
      </a>
    </div>
  </div>
</body>
</html>
